[package]
name = "photobooth-rs"
version = "0.2.4"
edition = "2021"
build = "build.rs"

[dependencies]
slint = { version = "1.8", features = ["backend-winit", "renderer-femtovg"] }
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
axum = "0.7"
nokhwa = { version = "0.10.11", features = ["input-native"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
imageproc = "0.25"
rayon = "1.10"
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
rusqlite = { version = "0.32", features = ["bundled"] }
qrcode = "0.14"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
slint-build = "1.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
